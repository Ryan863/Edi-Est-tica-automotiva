<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .monogram-e {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', serif;
        font-size: 155px;
        font-weight: 700;
        fill: #ffffff;
      }
      .monogram-d {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', serif;
        font-size: 155px;
        font-weight: 700;
        fill: #9da0a5;
      }
      .divider-line {
        stroke: #7d8084;
        stroke-width: 1.5;
      }
      .diamond {
        fill: #7d8084;
      }
    </style>
  </defs>
  
  <!-- Intertwined ED Monogram -->
  <g transform="translate(15, 145)">
    <!-- Letra E -->
    <text x="0" y="0" class="monogram-e">E</text>
    <!-- Letra D entrelaçada -->
    <text x="42" y="15" class="monogram-d">D</text>
  </g>
</svg>
